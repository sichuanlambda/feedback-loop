<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="collectionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="50%" style="stop-color:#c0392b"/>
      <stop offset="100%" style="stop-color:#a93226"/>
    </linearGradient>
  </defs>
  
  <!-- Badge circle -->
  <circle cx="32" cy="32" r="30" fill="url(#collectionGradient)" stroke="#922b21" stroke-width="2"/>
  
  <!-- Collection folder/portfolio icon -->
  <rect x="20" y="20" width="24" height="18" rx="2" fill="white" stroke="none"/>
  <rect x="22" y="22" width="20" height="2" fill="#e74c3c"/>
  <rect x="22" y="26" width="16" height="1.5" fill="#e74c3c"/>
  <rect x="22" y="29" width="18" height="1.5" fill="#e74c3c"/>
  <rect x="22" y="32" width="14" height="1.5" fill="#e74c3c"/>
  
  <!-- Small building icons in collection -->
  <rect x="24" y="42" width="2" height="4" fill="#e74c3c"/>
  <rect x="27" y="40" width="2" height="6" fill="#e74c3c"/>
  <rect x="30" y="42" width="2" height="4" fill="#e74c3c"/>
  <rect x="33" y="41" width="2" height="5" fill="#e74c3c"/>
  <rect x="36" y="43" width="2" height="3" fill="#e74c3c"/>
  
  <!-- Sparkle effect -->
  <circle cx="42" cy="24" r="1" fill="white"/>
  <circle cx="44" cy="27" r="0.8" fill="white"/>
  <circle cx="41" cy="30" r="0.6" fill="white"/>
  
  <!-- Badge border highlight -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
</svg>