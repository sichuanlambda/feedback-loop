<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="artDecoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6"/>
      <stop offset="50%" style="stop-color:#8e44ad"/>
      <stop offset="100%" style="stop-color:#7d3c98"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f"/>
      <stop offset="100%" style="stop-color:#d4ac0d"/>
    </linearGradient>
  </defs>
  
  <!-- Badge circle -->
  <circle cx="32" cy="32" r="30" fill="url(#artDecoGradient)" stroke="#6c3483" stroke-width="2"/>
  
  <!-- Art Deco building silhouette (Empire State Building inspired) -->
  <polygon points="32,12 28,16 28,28 26,28 26,32 24,32 24,44 40,44 40,32 38,32 38,28 36,28 36,16" fill="white"/>
  
  <!-- Art Deco details -->
  <rect x="30" y="18" width="4" height="2" fill="url(#goldAccent)"/>
  <rect x="29" y="22" width="6" height="1" fill="url(#goldAccent)"/>
  <rect x="28" y="26" width="8" height="1" fill="url(#goldAccent)"/>
  <rect x="26" y="30" width="12" height="1" fill="url(#goldAccent)"/>
  
  <!-- Windows pattern -->
  <rect x="29" y="34" width="1" height="2" fill="#9b59b6"/>
  <rect x="31" y="34" width="1" height="2" fill="#9b59b6"/>
  <rect x="33" y="34" width="1" height="2" fill="#9b59b6"/>
  <rect x="35" y="34" width="1" height="2" fill="#9b59b6"/>
  
  <rect x="29" y="37" width="1" height="2" fill="#9b59b6"/>
  <rect x="31" y="37" width="1" height="2" fill="#9b59b6"/>
  <rect x="33" y="37" width="1" height="2" fill="#9b59b6"/>
  <rect x="35" y="37" width="1" height="2" fill="#9b59b6"/>
  
  <rect x="29" y="40" width="1" height="2" fill="#9b59b6"/>
  <rect x="31" y="40" width="1" height="2" fill="#9b59b6"/>
  <rect x="33" y="40" width="1" height="2" fill="#9b59b6"/>
  <rect x="35" y="40" width="1" height="2" fill="#9b59b6"/>
  
  <!-- Art Deco sunburst pattern -->
  <path d="M32 12 L34 8 L36 12 Z" fill="url(#goldAccent)"/>
  <path d="M32 12 L38 10 L36 12 Z" fill="url(#goldAccent)"/>
  <path d="M32 12 L26 10 L28 12 Z" fill="url(#goldAccent)"/>
  
  <!-- Badge border highlight -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- Master designation -->
  <text x="32" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="white" font-weight="bold">MASTER</text>
</svg>